[project]
name = "npb"
version = "0.3.1"
description = "Fast Pydantic + NumPy binary serialization with zero-copy decode"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "NPB contributors" },
]
keywords = [
    "numpy",
    "pydantic",
    "serialization",
    "binary",
    "zero-copy",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=2.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
iceoryx2 = [
    "iceoryx2==0.9.3",
]
vineyard = [
    "vineyard>=0.24.2",
    "setuptools<81",
]
zeromq = [
    "pyzmq>=27.0",
]
zeromq-vineyard = [
    "pyzmq>=27.0",
    "vineyard>=0.24.2",
    "setuptools<81",
]
pipeline = [
    "iceoryx2==0.9.3",
    "pyzmq>=27.0",
    "vineyard>=0.24.2",
    "setuptools<81",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pyzmq>=27.0",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.10.0,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
